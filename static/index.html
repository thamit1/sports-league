// Compute bowling figures from the events list and render them grouped by bowler.
// `nameLookup` is an optional {id -> name} map; if omitted, the function falls
// back to State.kioskScore rosters (kiosk use case).
function _renderBowlingFigures(events, nameLookup) {
  // Build a name lookup. Prefer the passed-in lookup; fall back to kiosk rosters
  // for the in-kiosk caller; finally use whatever the events already include.
  const nameById = nameLookup ? { ...nameLookup } : {};
  if (!nameLookup) {
    (State.kioskScore?.rosterA || []).forEach(p => { nameById[p.id] = p.name; });
    (State.kioskScore?.rosterB || []).forEach(p => { nameById[p.id] = p.name; });
  }

  const byBowler = {};   // bowler_id -> {balls, runs, wickets}
  events.forEach(e => {
    const bid = e.event_data && e.event_data.bowler_id;
    if (!bid) return;
    const b = byBowler[bid] || { balls: 0, runs: 0, wickets: 0 };
    const t = e.event_type;
    const v = (e.event_data && typeof e.event_data.value === 'number') ? e.event_data.value : 0;

    if (t === 'wide' || t === 'no_ball') {
      // Illegal delivery: bowler conceded the run but it doesn't count as a ball bowled
      b.runs += v;
    } else if (t === 'bye' || t === 'leg_bye') {
      // Legal delivery; runs are NOT credited to the bowler
      b.balls += 1;
    } else {
      // Standard run / dot / wicket
      b.balls += 1;
      if (t === 'wicket') b.wickets += 1;
      else b.runs += v;
    }
    byBowler[bid] = b;
  });

  const rows = Object.entries(byBowler).map(([id, b]) => {
    const overs = `${Math.floor(b.balls / 6)}.${b.balls % 6}`;
    return { id: parseInt(id), name: nameById[id] || `Player #${id}`, overs, ...b };
  }).sort((x, y) => (y.wickets - x.wickets) || (x.runs - y.runs));

  if (!rows.length) return '<em style="color:#94a3b8">No bowler attributed yet. Pick a bowler before tapping run/wicket buttons.</em>';

  return `<div class="table-wrap"><table>
    <thead><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr></thead>
    <tbody>${rows.map(r => `
      <tr>
        <td><strong>${r.name}</strong></td>
        <td>${r.overs}</td>
        <td>${r.runs}</td>
        <td>${r.wickets}</td>
        <td>${r.balls > 0 ? (r.runs / (r.balls / 6)).toFixed(2) : '—'}</td>
      </tr>`).join('')}</tbody>
  </table></div>`;
}

// Build the small "Scoring as: …" selector for a team in attribution-aware widgets.
// `label` defaults to "Scoring as" but can be overridden ("Batter", "Bowler", etc.).
// `rosterSide` chooses which roster to pull from (defaults to `side`).
function _playerSelector(side, opts = {}) {
  const label      = opts.label || 'Scoring as';
  const rosterSide = opts.rosterSide || side;
  const stateKey   = opts.stateKey || (side === 'a' ? 'currentPlayerA' : 'currentPlayerB');
  const roster = rosterSide === 'a' ? State.kioskScore.rosterA : State.kioskScore.rosterB;
  if (!roster || !roster.length) {
    return `<div style="font-size:11px;color:var(--gray-500);text-align:center;margin-bottom:6px">No ${label.toLowerCase()} roster.</div>`;
  }
  return `<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:6px;justify-content:center">
    <span style="color:var(--gray-500);min-width:50px;text-align:right">${label}:</span>
    <select class="form-control" style="width:auto;font-size:12px;padding:4px 8px" onchange="kioskSetPlayerKey('${stateKey}', this.value)">
      <option value="">— pick —</option>
      ${roster.map(p => `<option value="${p.id}">${p.name}${p.jersey_no ? ' #'+p.jersey_no : ''}</option>`).join('')}
    </select>
  </div>`;
}

function kioskSetPlayerKey(key, value) {
  State.kioskScore[key] = value ? parseInt(value) : null;
}
// Back-compat shim for the older single-selector signature still used by the generic widget
function kioskSetPlayer(side, playerId) {
  kioskSetPlayerKey(side === 'a' ? 'currentPlayerA' : 'currentPlayerB', playerId);
}
function _currentPlayer(side) {
  return side === 'a' ? State.kioskScore.currentPlayerA : State.kioskScore.currentPlayerB;
}
function _currentBowlerAgainst(side) {
  // Bowler "against side A" comes from team B's roster (and vice versa)
  return side === 'a' ? State.kioskScore.currentBowlerVsA : State.kioskScore.currentBowlerVsB;
}

// Fire an event row in the background. Reloads the events feed on success/failure.
// `extra` is merged into event_data (e.g. {bowler_id: 12} for cricket).
async function _kioskLogEvent(side, event_type, value, extra) {
  const matchId = State.kioskScore.matchId;
  if (!matchId) return;
  try {
    await API.post(`/scoring/matches/${matchId}/events`, {
      team_side: side,
      player_id: _currentPlayer(side),
      event_type,
      value,
      extra: extra || null,
    });
    loadKioskEvents();
  } catch (e) {
    _kioskSetStatus('⚠ Event: ' + e.message);
  }
}

async function loadKioskEvents() {
  const el = document.getElementById('kiosk-events');
  if (!el) return;
  const matchId = State.kioskScore.matchId;
  try {
    const events = await API.get(`/scoring/matches/${matchId}/events`);
    // Build name lookup for bowlers across both rosters
    const nameById = {};
    (State.kioskScore.rosterA || []).forEach(p => { nameById[p.id] = p.name; });
    (State.kioskScore.rosterB || []).forEach(p => { nameById[p.id] = p.name; });

    if (!events.length) { el.innerHTML = '<em style="color:#94a3b8">No events logged.</em>'; }
    else {
      const top = events.slice(0, 10);
      el.innerHTML = top.map(e => {
        const val = (e.event_data && e.event_data.value != null) ? `+${e.event_data.value}` : '';
        const tName = e.team_name || '—';
        const pName = e.player_name || '—';
        const bowler = e.event_data && e.event_data.bowler_id
          ? `<span style="color:var(--gray-500);font-size:11px"> by ${nameById[e.event_data.bowler_id] || ('#'+e.event_data.bowler_id)}</span>` : '';
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-bottom:1px solid var(--gray-100)">
          <span><strong>${tName}</strong> · ${pName} · <span style="color:var(--brand);font-weight:700">${e.event_type}${val ? ' '+val : ''}</span>${bowler}</span>
          <button title="Undo this event" style="background:none;border:none;color:#dc2626;cursor:pointer;font-size:14px" onclick="undoKioskEvent(${e.id}, '${e.event_type}', ${e.event_data?.value ?? 'null'}, '${e.team_id === State.kioskScore.teamA ? 'a' : 'b'}')">✕</button>
        </div>`;
      }).join('');
    }

    // Cricket: refresh bowling figures from the same events payload
    const bowlEl = document.getElementById('kiosk-bowling');
    if (bowlEl) bowlEl.innerHTML = _renderBowlingFigures(events);
  } catch (err) {
    el.innerHTML = `<span style="color:#dc2626">${err.message}</span>`;
  }
}

// Delete an event and roll back the team's stored score by the same delta.
async function undoKioskEvent(eventId, eventType, value, side) {
  const matchId = State.kioskScore.matchId;
  try {
    await API.delete(`/scoring/matches/${matchId}/events/${eventId}`);
    // Roll back the kiosk-local score by the event's contribution
    const sport = (State.kioskScore.sport || '').toLowerCase();
    if (sport === 'cricket' && typeof State.kioskScore[side] === 'object') {
      const st = { ...State.kioskScore[side] };
      if (eventType === 'wicket') st.wickets = Math.max(0, (st.wickets||0) - 1);
      else if (typeof value === 'number') st.runs = Math.max(0, (st.runs||0) - value);
      // Best-effort ball rewind too
      if (st.balls > 0) st.balls -= 1;
      else if (st.overs > 0) { st.overs -= 1; st.balls = 5; }
      st.total = st.runs;
      State.kioskScore[side] = st;
    } else if (typeof value === 'number') {
      const cur = _scoreNum(State.kioskScore[side]);
      State.kioskScore[side] = Math.max(0, cur - value);
    }
    await _kioskSaveNow();
    // Re-render to refresh widget values + event feed
    navigate('scoring-match', { id: matchId });
  } catch (e) {
    _kioskSetStatus('⚠ Undo: ' + e.message);
  }
}

// ── Generic single-integer widget (football, basketball, volleyball, foosball,
//    and all sports that don't have a specific widget yet) ─────────────────

function _renderKioskGeneric(m) {
  const sa = _scoreNum(m.score_a);
  const sb = _scoreNum(m.score_b);
  // Default event type by sport (used when attribution is on)
  const sport = (m.sport_name || '').toLowerCase();
  const eventTypeFor = ({football:'goal', basketball:'point', volleyball:'point', foosball:'goal'})[sport] || 'point';
  return `
  <div class="kiosk-grid">
    <div class="kiosk-team">
      <div class="kiosk-team-name">${m.team_a_name||'Team A'}</div>
      ${_playerSelector('a')}
      <div class="kiosk-score" id="ks-a">${sa}</div>
      <div class="kiosk-btns">
        <button class="kiosk-btn kiosk-minus" onclick="kioskAdjustGeneric('a',-1,'${eventTypeFor}')">−</button>
        <button class="kiosk-btn kiosk-plus"  onclick="kioskAdjustGeneric('a',+1,'${eventTypeFor}')">+</button>
      </div>
    </div>
    <div class="kiosk-vs">VS</div>
    <div class="kiosk-team">
      <div class="kiosk-team-name">${m.team_b_name||'Team B'}</div>
      ${_playerSelector('b')}
      <div class="kiosk-score" id="ks-b">${sb}</div>
      <div class="kiosk-btns">
        <button class="kiosk-btn kiosk-minus" onclick="kioskAdjustGeneric('b',-1,'${eventTypeFor}')">−</button>
        <button class="kiosk-btn kiosk-plus"  onclick="kioskAdjustGeneric('b',+1,'${eventTypeFor}')">+</button>
      </div>
    </div>
  </div>`;
}

function kioskAdjustGeneric(side, delta, eventType) {
  const cur = _scoreNum(State.kioskScore[side]);
  const next = Math.max(0, cur + delta);
  State.kioskScore[side] = next;
  document.getElementById('ks-' + side).textContent = next;
  _kioskSaveDebounced();
  if (delta > 0) _kioskLogEvent(side, eventType || 'point', delta);
  // Negative deltas don't log a "negative" event — they're treated as score corrections.
  // Use the events feed ✕ button to properly undo a logged event.
}

// ── Cricket widget ────────────────────────────────────────────────────────

function _cricketState(side) {
  const s = State.kioskScore[side];
  if (s && typeof s === 'object' && 'runs' in s) {
    return { runs: s.runs||0, wickets: s.wickets||0, overs: s.overs||0, balls: s.balls||0 };
  }
  return { runs: 0, wickets: 0, overs: 0, balls: 0 };
}

function _renderKioskCricket(m) {
  const a = _cricketState('a'), b = _cricketState('b');
  const cardFor = (side, name, st) => {
    const otherSide   = side === 'a' ? 'b' : 'a';
    const batterKey   = side === 'a' ? 'currentPlayerA' : 'currentPlayerB';
    const bowlerKey   = side === 'a' ? 'currentBowlerVsA' : 'currentBowlerVsB';
    return `
    <div class="kiosk-team" style="text-align:left">
      <div class="kiosk-team-name" style="text-align:center">${name}</div>
      ${_playerSelector(side, {label:'Batter', rosterSide: side,        stateKey: batterKey})}
      ${_playerSelector(side, {label:'Bowler', rosterSide: otherSide,   stateKey: bowlerKey})}
      <div style="text-align:center;font-family:monospace;font-weight:800;font-size:32px;color:var(--brand);margin:6px 0">
        <span id="cr-${side}-runs">${st.runs}</span>/<span id="cr-${side}-wkts">${st.wickets}</span>
        <span style="font-size:18px;color:var(--gray-500);font-weight:600"> (<span id="cr-${side}-over">${st.overs}</span>.<span id="cr-${side}-balls">${st.balls}</span>)</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
        ${[0,1,2,3,4,6].map(r => `<button class="kiosk-btn kiosk-plus" style="height:48px;font-size:18px" onclick="cricketRun('${side}',${r})">${r===0?'•':'+'+r}</button>`).join('')}
        <button class="kiosk-btn kiosk-minus" style="height:48px;font-size:14px" onclick="cricketWicket('${side}')">W</button>
        <button class="kiosk-btn" style="height:48px;background:#fde68a;color:#78350f;border:none;font-weight:700" onclick="cricketUndoBall('${side}')">⤺</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px">
        <button class="kiosk-btn" style="height:38px;font-size:12px;background:#e0e7ff;color:#3730a3;border:none;font-weight:700" onclick="cricketExtra('${side}','wide')">Wd</button>
        <button class="kiosk-btn" style="height:38px;font-size:12px;background:#e0e7ff;color:#3730a3;border:none;font-weight:700" onclick="cricketExtra('${side}','no_ball')">Nb</button>
        <button class="kiosk-btn" style="height:38px;font-size:12px;background:#d1fae5;color:#065f46;border:none;font-weight:700" onclick="cricketExtra('${side}','bye')">B</button>
        <button class="kiosk-btn" style="height:38px;font-size:12px;background:#d1fae5;color:#065f46;border:none;font-weight:700" onclick="cricketExtra('${side}','leg_bye')">LB</button>
      </div>
      <div style="font-size:11px;color:var(--gray-500);text-align:center;margin-top:6px">
        Wd/Nb: +1 run, no ball bowled (illegal delivery). B/LB: +1 run, +1 ball (bowler not charged). Tap multiple times for multi-run extras.
      </div>
    </div>`;
  };
  return `<div class="kiosk-grid">
    ${cardFor('a', m.team_a_name||'Team A', a)}
    <div class="kiosk-vs">VS</div>
    ${cardFor('b', m.team_b_name||'Team B', b)}
  </div>`;
}

function _cricketSet(side, st) {
  // store with `total: runs` so the rating engine's _coerce_score picks up runs as the number
  State.kioskScore[side] = { ...st, total: st.runs };
  document.getElementById(`cr-${side}-runs`).textContent  = st.runs;
  document.getElementById(`cr-${side}-wkts`).textContent  = st.wickets;
  document.getElementById(`cr-${side}-over`).textContent  = st.overs;
  document.getElementById(`cr-${side}-balls`).textContent = st.balls;
}

function _cricketAdvanceBall(st) {
  // Phase 6 MVP: every legal-delivery button advances 1 ball. Wides/no-balls are
  // captured via the existing Match Events flow rather than complicating the kiosk.
  st.balls += 1;
  if (st.balls >= 6) { st.balls = 0; st.overs += 1; }
}

function cricketRun(side, runs) {
  const st = _cricketState(side);
  st.runs += runs;
  _cricketAdvanceBall(st);
  _cricketSet(side, st);
  _kioskSaveDebounced();
  const bowler_id = _currentBowlerAgainst(side);
  _kioskLogEvent(side, runs === 0 ? 'dot' : 'run', runs, bowler_id ? { bowler_id } : null);
}

function cricketWicket(side) {
  const st = _cricketState(side);
  st.wickets = Math.min(10, st.wickets + 1);
  _cricketAdvanceBall(st);
  _cricketSet(side, st);
  _kioskSaveDebounced();
  const bowler_id = _currentBowlerAgainst(side);
  _kioskLogEvent(side, 'wicket', null, bowler_id ? { bowler_id } : null);
}

/**
 * Cricket extras — adds +1 run to the batting side's total but applies
 * different ball-counter and bowler-figures semantics:
 *
 *   wide / no_ball  → +1 run, NO ball advance (illegal delivery, re-bowled)
 *   bye / leg_bye   → +1 run, +1 ball advance (legal delivery, bowler not charged)
 *
 * Bowling-figures rollup in _renderBowlingFigures honours this for the
 * 'balls bowled' and 'runs conceded' columns.
 */
function cricketExtra(side, type) {
  const st = _cricketState(side);
  st.runs += 1;
  if (type === 'bye' || type === 'leg_bye') {
    _cricketAdvanceBall(st);
  }
  _cricketSet(side, st);
  _kioskSaveDebounced();
  const bowler_id = _currentBowlerAgainst(side);
  _kioskLogEvent(side, type, 1, bowler_id ? { bowler_id } : null);
}

function cricketUndoBall(side) {
  // Best-effort undo: just rewind the ball/over counter. Runs/wickets stay unless the user adjusts manually.
  const st = _cricketState(side);
  if (st.balls > 0) { st.balls -= 1; }
  else if (st.overs > 0) { st.overs -= 1; st.balls = 5; }
  _cricketSet(side, st);
  _kioskSaveDebounced();
}

// ── Tennis widget ────────────────────────────────────────────────────────

const _TENNIS_POINT_ORDER = ['0','15','30','40'];

function _tennisState(side) {
  const s = State.kioskScore[side];
  if (s && typeof s === 'object' && 'games' in s) {
    return {
      sets:     s.sets || 0,
      games:    s.games || 0,
      points:   s.points || '0',
      set_history: Array.isArray(s.set_history) ? s.set_history : [],
    };
  }
  return { sets: 0, games: 0, points: '0', set_history: [] };
}

function _tennisStore(side, st) {
  State.kioskScore[side] = { ...st, total: st.sets };
}

function _renderKioskTennis(m) {
  const a = _tennisState('a'), b = _tennisState('b');
  const setStrip = (st) => st.set_history.map((s, i) => `<span style="margin-right:4px;font-family:monospace;color:var(--gray-500)">S${i+1}: ${s[0]}-${s[1]}</span>`).join('') || '<em style="color:var(--gray-500);font-size:11px">No completed sets yet</em>';
  const cardFor = (side, name, st) => `
    <div class="kiosk-team">
      <div class="kiosk-team-name">${name}</div>
      ${_playerSelector(side)}
      <div style="text-align:center;font-family:monospace;font-weight:800;font-size:36px;color:var(--brand);margin:6px 0">
        <span title="Sets won">${st.sets}</span>
        <span style="font-size:14px;color:var(--gray-500)">sets</span>
      </div>
      <div style="text-align:center;font-size:14px;margin-bottom:6px">
        <strong>${st.games}</strong> games · <strong>${st.points}</strong> pts
      </div>
      <button class="kiosk-btn kiosk-plus" style="height:56px;font-size:18px;width:100%" onclick="tennisPoint('${side}')">+1 point</button>
      <div style="font-size:11px;color:var(--gray-500);margin-top:6px;text-align:center">${setStrip(st)}</div>
    </div>`;
  return `<div class="kiosk-grid">
    ${cardFor('a', m.team_a_name || 'Side A', a)}
    <div class="kiosk-vs">VS</div>
    ${cardFor('b', m.team_b_name || 'Side B', b)}
  </div>`;
}

function _tennisAdvancePoint(side) {
  const a = _tennisState('a'), b = _tennisState('b');
  const winner = side === 'a' ? a : b;
  const loser  = side === 'a' ? b : a;

  // Deuce / advantage logic
  if (winner.points === '40' && loser.points === '40') {
    winner.points = 'AD';
  } else if (winner.points === 'AD') {
    return _tennisAwardGame(side);
  } else if (loser.points === 'AD') {
    // Loser had advantage; back to deuce
    loser.points = '40';
  } else if (winner.points === '40') {
    return _tennisAwardGame(side);
  } else {
    // Normal progression 0 → 15 → 30 → 40
    const idx = _TENNIS_POINT_ORDER.indexOf(winner.points);
    winner.points = _TENNIS_POINT_ORDER[Math.min(idx + 1, _TENNIS_POINT_ORDER.length - 1)];
  }
  _tennisStore('a', a);
  _tennisStore('b', b);
}

function _tennisAwardGame(side) {
  const a = _tennisState('a'), b = _tennisState('b');
  const winner = side === 'a' ? a : b;
  const loser  = side === 'a' ? b : a;
  winner.games += 1;
  winner.points = '0';
  loser.points  = '0';
  // Set won at >= 6 games with a 2-game lead. (No tiebreak in MVP.)
  if (winner.games >= 6 && winner.games - loser.games >= 2) {
    winner.set_history = [...winner.set_history, [winner.games, loser.games]];
    loser.set_history  = [...loser.set_history,  [loser.games,  winner.games]];
    winner.sets += 1;
    winner.games = 0;
    loser.games  = 0;
  }
  _tennisStore('a', a);
  _tennisStore('b', b);
}

function tennisPoint(side) {
  _tennisAdvancePoint(side);
  _kioskSaveDebounced();
  _kioskLogEvent(side, 'point', 1);
  // Re-render to refresh the displayed point/game/set numbers (cheaper than threading IDs around).
  setTimeout(() => navigate('scoring-match', { id: State.kioskScore.matchId }), 50);
}


// ── Racket points widget — Badminton / Table Tennis / Pickleball ─────────
// Score keeper drives points with +/−; "End Game" commits the current game
// to history and starts the next. `target` is just an informational hint —
// the score keeper decides when the game is actually over.

function _racketState(side) {
  const s = State.kioskScore[side];
  if (s && typeof s === 'object' && 'games' in s) {
    return {
      games:        s.games || 0,
      points:       s.points || 0,
      game_history: Array.isArray(s.game_history) ? s.game_history : [],
    };
  }
  return { games: 0, points: 0, game_history: [] };
}

function _racketTotal(st) {
  // Cumulative points across all games + current (for the rating engine's POINT_RATIO rule)
  return (st.game_history || []).reduce((acc, g) => acc + (g || 0), 0) + (st.points || 0);
}

function _racketStore(side, st) {
  State.kioskScore[side] = { ...st, total: _racketTotal(st) };
}

function _renderKioskRacket(m, target) {
  const a = _racketState('a'), b = _racketState('b');
  const hist = (st) => st.game_history.map((p, i) => `<span style="margin-right:4px;font-family:monospace;color:var(--gray-500)">G${i+1}: ${p}</span>`).join('') || '<em style="color:var(--gray-500);font-size:11px">No completed games yet</em>';
  const cardFor = (side, name, st) => `
    <div class="kiosk-team">
      <div class="kiosk-team-name">${name}</div>
      ${_playerSelector(side)}
      <div style="text-align:center;font-family:monospace;font-weight:800;font-size:30px;color:var(--brand);margin:4px 0">
        <span>${st.games}</span>
        <span style="font-size:14px;color:var(--gray-500)">games</span>
      </div>
      <div style="text-align:center;font-family:monospace;font-weight:800;font-size:48px;color:#0f172a;margin:4px 0">${st.points}</div>
      <div class="kiosk-btns">
        <button class="kiosk-btn kiosk-minus" onclick="racketAdjust('${side}',-1)">−</button>
        <button class="kiosk-btn kiosk-plus"  onclick="racketAdjust('${side}',+1)">+</button>
      </div>
      <button class="kiosk-btn" style="height:40px;background:#fde68a;color:#78350f;border:none;font-weight:700;margin-top:6px;width:100%" onclick="racketEndGame('${side}')">End game (target ${target})</button>
      <div style="font-size:11px;color:var(--gray-500);margin-top:6px;text-align:center">${hist(st)}</div>
    </div>`;
  return `<div class="kiosk-grid">
    ${cardFor('a', m.team_a_name || 'Side A', a)}
    <div class="kiosk-vs">VS</div>
    ${cardFor('b', m.team_b_name || 'Side B', b)}
  </div>`;
}

function racketAdjust(side, delta) {
  const st = _racketState(side);
  st.points = Math.max(0, st.points + delta);
  _racketStore(side, st);
  document.querySelectorAll('.kiosk-team').forEach(()=>{}); // no-op; let next render refresh
  _kioskSaveDebounced();
  if (delta > 0) _kioskLogEvent(side, 'point', 1);
  setTimeout(() => navigate('scoring-match', { id: State.kioskScore.matchId }), 50);
}

function racketEndGame(side) {
  // Commit BOTH sides' current points into history, mark the side passed in
  // as the game winner (++ games), reset current points.
  const a = _racketState('a'), b = _racketState('b');
  a.game_history = [...a.game_history, a.points];
  b.game_history = [...b.game_history, b.points];
  if (side === 'a') a.games += 1;
  else              b.games += 1;
  a.points = 0;
  b.points = 0;
  _racketStore('a', a);
  _racketStore('b', b);
  _kioskSaveNow().then(() => navigate('scoring-match', { id: State.kioskScore.matchId }));
}


// ── Timed / round-scored widget — Swimming / Rowing / Archery ───────────
// Swimming & Rowing: lower is better, score stored as seconds (float).
// Archery: higher is better, score stored as points.
// Player attribution doesn't make much sense (the player IS the side), so no
// selector is shown — but the events feed is suppressed via the dispatcher's
// `supportsAttribution` list.

function _timedState(side) {
  const s = State.kioskScore[side];
  if (s != null && (typeof s === 'number')) return { value: s };
  if (s && typeof s === 'object' && 'value' in s) return { value: s.value || 0 };
  return { value: 0 };
}

function _renderKioskTimed(m, opts) {
  const a = _timedState('a'), b = _timedState('b');
  const helpText = opts.lowerIsBetter
    ? 'Lower wins (time in seconds). Use the input to enter a result; decimals allowed.'
    : 'Higher wins. Use the input to record points.';
  const cardFor = (side, name, st) => `
    <div class="kiosk-team">
      <div class="kiosk-team-name">${name}</div>
      <div style="text-align:center;font-family:monospace;font-weight:800;font-size:40px;color:var(--brand);margin:10px 0">
        <span id="tm-${side}">${st.value || '—'}</span>
        <span style="font-size:12px;color:var(--gray-500);margin-left:4px">${opts.unit}</span>
      </div>
      <input type="number" step="0.01" min="0" class="form-control" id="tm-input-${side}" placeholder="${opts.label}" value="${st.value || ''}" oninput="timedSet('${side}', this.value, ${opts.lowerIsBetter})"/>
    </div>`;
  return `<div class="kiosk-grid">
    ${cardFor('a', m.team_a_name || 'Side A', a)}
    <div class="kiosk-vs">VS</div>
    ${cardFor('b', m.team_b_name || 'Side B', b)}
  </div>
  <div style="text-align:center;font-size:12px;color:var(--gray-500);margin-top:10px">${helpText}</div>`;
}

function timedSet(side, raw, lowerIsBetter) {
  const v = parseFloat(raw);
  if (isNaN(v) || v < 0) {
    State.kioskScore[side] = null;
  } else {
    State.kioskScore[side] = v;
    document.getElementById('tm-' + side).textContent = v;
  }
  // For lower-is-better sports, the rating engine handles inversion itself via
  // TIME_INVERTED — so we just store the raw value. The winner is computed in
  // _kioskWinnerId, which we override for these sports below.
  _kioskSaveDebounced();
  // Note: winner logic in _kioskWinnerId assumes higher = better; for timed sports
  // we'll patch it via a sport-specific override at save time. For simplicity we
  // recompute the winner here based on lowerIsBetter when both values present.
  State.kioskScore._lowerIsBetter = !!lowerIsBetter;
}


// ── Frame / Leg / Board widget — Snooker / Billiards / Darts / Carrom ───
// All four share the same shape (track count of units won). Each "unit" is a
// frame / leg / board depending on the sport — passed in via `noun`.

function _frameState(side) {
  const s = State.kioskScore[side];
  if (s && typeof s === 'object' && 'frames' in s) {
    return { frames: s.frames || 0 };
  }
  return { frames: 0 };
}

function _frameStore(side, st) {
  State.kioskScore[side] = { frames: st.frames, total: st.frames };
}

function _renderKioskFrame(m, noun) {
  const a = _frameState('a'), b = _frameState('b');
  const capNoun = noun.charAt(0).toUpperCase() + noun.slice(1);
  const cardFor = (side, name, st) => `
    <div class="kiosk-team">
      <div class="kiosk-team-name">${name}</div>
      ${_playerSelector(side)}
      <div style="text-align:center;font-family:monospace;font-weight:800;font-size:64px;color:var(--brand);line-height:1;margin:10px 0">${st.frames}</div>
      <div style="text-align:center;font-size:13px;color:var(--gray-500);margin-bottom:8px">${noun}s won</div>
      <div class="kiosk-btns">
        <button class="kiosk-btn kiosk-minus" onclick="frameAdjust('${side}',-1,'${noun}')">−</button>
        <button class="kiosk-btn kiosk-plus"  onclick="frameAdjust('${side}',+1,'${noun}')">+ ${capNoun}</button>
      </div>
    </div>`;
  return `<div class="kiosk-grid">
    ${cardFor('a', m.team_a_name || 'Side A', a)}
    <div class="kiosk-vs">VS</div>
    ${cardFor('b', m.team_b_name || 'Side B', b)}
  </div>`;
}

function frameAdjust(side, delta, noun) {
  const st = _frameState(side);
  st.frames = Math.max(0, st.frames + delta);
  _frameStore(side, st);
  _kioskSaveDebounced();
  if (delta > 0) _kioskLogEvent(side, noun, 1);
  // Re-render so the big number reflects the change. (Simpler than DOM-ID juggling.)
  setTimeout(() => navigate('scoring-match', { id: State.kioskScore.matchId }), 50);
}


// ── Chess widget ─────────────────────────────────────────────────────────

function _renderKioskChess(m) {
  // score is 1 / 0.5 / 0 (per the rating engine's chess rule)
  const cur = (val) => {
    if (State.kioskScore.a === val && State.kioskScore.b === (1 - val)) return ' style="background:#16a34a;color:#fff;border:2px solid #15803d"';
    return '';
  };
  const drawActive = State.kioskScore.a === 0.5 && State.kioskScore.b === 0.5
    ? ' style="background:#64748b;color:#fff;border:2px solid #475569"' : '';
  return `
  <div style="display:flex;flex-direction:column;gap:10px;max-width:400px;margin:18px auto">
    <button class="kiosk-btn" style="height:72px;font-size:18px;border:1px solid var(--gray-200);background:#fff"${cur(1)} onclick="chessResult(1)">
      ♔ ${m.team_a_name||'White'} wins (1–0)
    </button>
    <button class="kiosk-btn" style="height:72px;font-size:18px;border:1px solid var(--gray-200);background:#fff"${drawActive} onclick="chessResult(0.5)">
      ½ Draw (½–½)
    </button>
    <button class="kiosk-btn" style="height:72px;font-size:18px;border:1px solid var(--gray-200);background:#fff"${cur(0)} onclick="chessResult(0)">
      ♚ ${m.team_b_name||'Black'} wins (0–1)
    </button>
  </div>`;
}

async function chessResult(scoreA) {
  State.kioskScore.a = scoreA;
  State.kioskScore.b = scoreA === 0.5 ? 0.5 : (1 - scoreA);
  await _kioskSaveNow();
  navigate('scoring-match', { id: State.kioskScore.matchId });
}

// ── Tug of War / binary widget ───────────────────────────────────────────

function _renderKioskBinary(m) {
  const aWon = State.kioskScore.a === 1 && State.kioskScore.b === 0;
  const bWon = State.kioskScore.b === 1 && State.kioskScore.a === 0;
  return `
  <div style="display:flex;flex-direction:column;gap:10px;max-width:400px;margin:18px auto">
    <button class="kiosk-btn" style="height:80px;font-size:18px;border:1px solid var(--gray-200);background:${aWon?'#16a34a':'#fff'};color:${aWon?'#fff':'inherit'}" onclick="binaryWinner('a')">
      🏆 ${m.team_a_name||'Team A'} wins
    </button>
    <button class="kiosk-btn" style="height:80px;font-size:18px;border:1px solid var(--gray-200);background:${bWon?'#16a34a':'#fff'};color:${bWon?'#fff':'inherit'}" onclick="binaryWinner('b')">
      🏆 ${m.team_b_name||'Team B'} wins
    </button>
  </div>`;
}

async function binaryWinner(side) {
  State.kioskScore.a = side === 'a' ? 1 : 0;
  State.kioskScore.b = side === 'b' ? 1 : 0;
  await _kioskSaveNow();
  navigate('scoring-match', { id: State.kioskScore.matchId });
}

// In-memory state for the current kiosk view (avoids re-fetching after every tap).
// Sport-aware: a/b can be int, float (chess), or object (cricket).
State.kioskScore = { a: 0, b: 0, matchId: null, sport: null, teamA: null, teamB: null };

function _kioskWinnerId() {
  const aNum = _scoreNum(State.kioskScore.a);
  const bNum = _scoreNum(State.kioskScore.b);
  if (aNum === bNum) return null;
  const lowerIsBetter = !!State.kioskScore._lowerIsBetter;
  if (lowerIsBetter) {
    return aNum < bNum ? State.kioskScore.teamA : State.kioskScore.teamB;
  }
  return aNum > bNum ? State.kioskScore.teamA : State.kioskScore.teamB;
}

function _kioskSetStatus(msg) {
  const el = document.getElementById('kiosk-status');
  if (el) el.textContent = msg;
}

async function _kioskSaveNow() {
  const matchId = State.kioskScore.matchId;
  if (!matchId) return;
  clearTimeout(State.kioskScore._timer);
  _kioskSetStatus('Saving…');
  try {
    await API.patch(`/scoring/matches/${matchId}/score`, {
      score_a: State.kioskScore.a, score_b: State.kioskScore.b,
      winner_id: _kioskWinnerId(),
    });
    _kioskSetStatus('✓ Saved');
    setTimeout(() => _kioskSetStatus(''), 1500);
  } catch (e) { _kioskSetStatus('⚠ ' + e.message); throw e; }
}

function _kioskSaveDebounced() {
  const matchId = State.kioskScore.matchId;
  if (!matchId) return;
  clearTimeout(State.kioskScore._timer);
  _kioskSetStatus('Saving…');
  State.kioskScore._timer = setTimeout(async () => {
    try {
      await API.patch(`/scoring/matches/${matchId}/score`, {
        score_a: State.kioskScore.a,
        score_b: State.kioskScore.b,
        winner_id: _kioskWinnerId(),
      });
      _kioskSetStatus('✓ Saved');
      setTimeout(() => _kioskSetStatus(''), 1500);
    } catch (e) { _kioskSetStatus('⚠ ' + e.message); }
  }, 600);
}

async function kioskFinalize(matchId) {
  if (!confirm('Finalize this match? It will move to "awaiting confirmation" and become eligible for ratings once both captains confirm.')) return;
  try {
    // Flush any pending debounced save before finalizing
    if (State.kioskScore._timer) {
      clearTimeout(State.kioskScore._timer);
      await API.patch(`/scoring/matches/${matchId}/score`, {
        score_a: State.kioskScore.a, score_b: State.kioskScore.b,
        winner_id: _kioskWinnerId(),
      });
    }
    await API.post(`/scoring/matches/${matchId}/finalize`);
    showAlert('Match finalized.', 'success');
    State.kioskScore = { a: 0, b: 0, matchId: null, sport: null, teamA: null, teamB: null };
    navigate('scoring');
  } catch (e) { showAlert(e.message); }
}

// ═══════════════════════════════════════════════════════════════════
//  SHELL: Sidebar + Topbar
// ═══════════════════════════════════════════════════════════════════
const NAV_ITEMS = [
  { id:'dashboard',   label:'Dashboard',   icon:'📊' },
  { id:'players',     label:'Players',     icon:'👤' },
  { id:'teams',       label:'Teams',       icon:'🛡️' },
  { id:'matches',     label:'Matches',     icon:'⚔️' },
  { id:'scoring',     label:'Scoring',     icon:'📋', show: () => isScoreCapable() },
  { id:'ratings',     label:'Ratings',     icon:'⭐' },
  { id:'tournaments', label:'Tournaments', icon:'🏆' },
  { id:'leagues',     label:'Leagues',     icon:'🎖️' },
  { id:'my-teams',    label:'My Teams',    icon:'🏅', show: () => isCaptainAnywhere() },
  { id:'sports',      label:'Sports',      icon:'🏅' },
  { id:'clubs',       label:'Clubs',       icon:'🏢' },
];

function renderShell(innerHTML) {
  const u = State.user;
  return `
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="icon">🏆</div>
      <div><h1>SLMS</h1><p>Sports League Mgmt</p></div>
    </div>
    <nav class="nav">
      ${NAV_ITEMS.filter(n => !n.show || n.show()).map(n => `
      <button class="nav-item ${State.currentPage.startsWith(n.id) ? 'active' : ''}"
        onclick="navigate('${n.id}')">
        <span class="nav-icon">${n.icon}</span>${n.label}
      </button>`).join('')}
    </nav>
    <div class="sidebar-user">
      <div class="user-info">
        <div class="user-avatar">${initials(u)}</div>
        <div>
          <div class="user-name">${u?.full_name||u?.first_name||'User'}</div>
          <div class="user-role">${(u?.role||'').replace(/_/g,' ')}</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">🚪 Sign out</button>
    </div>
  </div>
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button style="display:none;background:none;border:none;font-size:20px;cursor:pointer" id="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div style="font-weight:700;font-size:15px">${NAV_ITEMS.find(n=>State.currentPage.startsWith(n.id))?.label||'SLMS'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <div id="global-alert" class="alert" style="display:none;margin:0;padding:8px 14px;font-size:12px"></div>
        <span style="font-size:12px;color:var(--gray-500)">${u?.global_player_id||''}</span>
      </div>
    </div>
    <div class="page" id="page-content">
      ${innerHTML}
    </div>
  </div>`;
}

// ─── Debounce ─────────────────────────────────────────────────────
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// ═══════════════════════════════════════════════════════════════════
//  MAIN RENDER LOOP
// ═══════════════════════════════════════════════════════════════════
async function render() {
  const root = document.getElementById('app');

  if (!State.user || !State.token) {
    if (State.currentPage === 'register') {
      root.innerHTML = renderRegister();
      bindRegister();
    } else {
      root.innerHTML = renderLogin();
      bindLogin();
    }
    return;
  }

  if (State.user.password_reset_required && State.currentPage !== 'change-password') {
    State.currentPage = 'change-password';
  }

  // Show loading shell first
  root.innerHTML = renderShell('<div class="loading-page"><div class="spinner"></div></div>');

  let pageHTML = '';
  try {
    switch (State.currentPage) {
      case 'dashboard':         pageHTML = await renderDashboard();        break;
      case 'players':           pageHTML = await renderPlayers();          break;
      case 'player-detail':     pageHTML = await renderPlayerDetail();     break;
      case 'change-password':    pageHTML = await renderChangePassword();  break;
      case 'teams':             pageHTML = await renderTeams();            break;
      case 'team-detail':       pageHTML = await renderTeamDetail();       break;
      case 'matches':           pageHTML = await renderMatches();          break;
      case 'match-detail':      pageHTML = await renderMatchDetail();      break;
      case 'tournaments':       pageHTML = await renderTournaments();      break;
      case 'tournament-detail': pageHTML = await renderTournamentDetail(); break;
      case 'sports':            pageHTML = await renderSports();           break;
      case 'ratings':           pageHTML = await renderRatings();          break;
      case 'scoring':           pageHTML = await renderScoring();          break;
      case 'scoring-match':     pageHTML = await renderScoringMatch();     break;
      case 'leagues':           pageHTML = await renderLeagues();          break;
      case 'league-detail':     pageHTML = await renderLeagueDetail();     break;
      case 'my-teams':          pageHTML = await renderMyTeams();          break;
      case 'clubs':             pageHTML = await renderClubs();            break;
      default:                  pageHTML = await renderDashboard();
    }
  } catch (err) {
    pageHTML = `<div class="alert alert-error">Error loading page: ${err.message}</div>`;
  }

  // Re-render with full content
  root.innerHTML = renderShell(pageHTML);

  // Post-mount hooks for pages that load data into placeholder slots
  try {
    if (State.currentPage === 'dashboard')           _hydrateDashboardSportSelect();
    else if (State.currentPage === 'player-detail')  loadPlayerRatings(State.pageParams?.id);
    else if (State.currentPage === 'ratings')        hydrateRatingsPage();
    else if (State.currentPage === 'match-detail')   {
      loadMatchAssignments(State.pageParams?.id);
      loadMatchConfirmations(State.pageParams?.id);
      loadMatchBowlingFigures(State.pageParams?.id);
    }
    else if (State.currentPage === 'team-detail')    loadTeamCaptains(State.pageParams?.id);
    else if (State.currentPage === 'league-detail')  loadLeagueStandings(State.pageParams?.id);
    else if (State.currentPage === 'scoring-match')  loadKioskEvents();
    if (State.currentPage === 'player-detail')       loadUserAssignments(State.pageParams?.id);
    if (State.currentPage !== 'scoring-match')       State.kioskScore = { a: 0, b: 0, matchId: null };
  } catch(e) { /* non-fatal */ }
  if (State.currentPage === 'change-password') {
    bindChangePassword();
  }

  // Mobile menu button visibility
  const menuBtn = document.getElementById('menu-btn');
  if (menuBtn) menuBtn.style.display = window.innerWidth < 769 ? 'block' : 'none';
}

// Boot
render();
</script>
</body>
</html>
